<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StatCan Series</title>
  </head>
  <body>
    <main class="viz-root">
      <header>
        <div class="heading">
          <h1 id="title">Statistics Canada data</h1>
          <p id="subtitle" class="muted"></p>
        </div>
        <div class="toolbar">
          <div class="tabs" role="tablist" aria-label="View">
            <button type="button" role="tab" id="tab-chart" aria-selected="true" aria-controls="chart-view">Chart</button>
            <button type="button" role="tab" id="tab-table" aria-selected="false" aria-controls="table-view">Table</button>
          </div>
          <button type="button" id="download" class="action" hidden>Download CSV</button>
          <button type="button" id="source" class="action" hidden>Open source</button>
        </div>
      </header>

      <p id="status" class="muted" role="status">Waiting for data from Statistics Canada…</p>

      <section id="chart-view" role="tabpanel" aria-labelledby="tab-chart">
        <div class="chart-wrap">
          <canvas id="chart" tabindex="0" role="img"></canvas>
          <div id="tooltip" class="tooltip" role="status" hidden></div>
        </div>
        <div id="legend" class="legend" role="group" aria-label="Series"></div>
        <p id="legend-note" class="muted small"></p>
      </section>

      <section id="table-view" role="tabpanel" aria-labelledby="tab-table" hidden>
        <div class="table-wrap"><table id="table"></table></div>
      </section>

      <footer id="footer" class="muted small"></footer>
    </main>
    <script type="module" src="/src/series-view.ts"></script>
  </body>
</html>
